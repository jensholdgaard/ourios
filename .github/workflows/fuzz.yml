name: Fuzz

# Every scheduled fuzzing run of the RFC 0015 cargo-fuzz targets, in one
# workflow:
#
# - `smoke`: bounded smoke-fuzz on the pinned nightly; a crash fails the
#   job and uploads the reproducer. The Phase 1 gate (RFC0015.5).
# - `batch`: ClusterFuzzLite batch fuzzing (Phase 2, RFC0015.7), built from
#   .clusterfuzzlite/, which grows and persists the corpus between runs.
# - `coverage`: weekly line coverage of what the accumulated corpus reaches.
#
# Each job keys off its own `schedule` entry via its `if:`; a dispatch picks
# jobs with the `job` input. Not a required check.
#
# libFuzzer requires nightly; it is contained to the smoke job via an
# explicit `+nightly-<date>` invocation, so the stable pin in
# `rust-toolchain.toml` still governs every shipping crate. ClusterFuzzLite
# builds on the same nightly inside its container (the Dockerfile's
# RUSTUP_TOOLCHAIN); ci.yml's `fuzz-toolchain` job keeps the two pins equal.

# Deliberately NOT on `pull_request`: the sanitizer build (datafusion
# under ASan, minutes per target) is too heavy for per-change CI, and
# ClusterFuzzLite's per-PR mode is out for the same reason (RFC 0015 §3.4).
# Use `workflow_dispatch` for an on-demand run against a branch.
#
# On `main` the smoke run also exports the code under test's own OTel
# metrics to the external OTLP backend (#942); see the smoke step's env.
on:
  schedule:
    - cron: "0 2 * * *" # batch: daily
    - cron: "17 4 * * *" # smoke: daily
    - cron: "0 3 * * 1" # coverage: weekly, Monday
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: all
        options: [all, smoke, batch, coverage]

permissions:
  contents: read

env:
  # Pinned for reproducibility; bumped by Renovate like the other
  # toolchains (RFC 0015 §7).
  NIGHTLY: nightly-2026-06-01

jobs:
  smoke:
    name: smoke-fuzz ${{ matrix.target }}
    if: github.event.schedule == '17 4 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'smoke'))
    runs-on: ubuntu-latest
    # A newer push to a branch supersedes its running smoke-fuzz; on `main`
    # every run completes so the daily signal is never dropped.
    concurrency:
      group: fuzz-smoke-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        target: [miner_roundtrip, otlp_json, otlp_protobuf, wal_frame, dsl_parse]
    env:
      # The one gate for every OTEL_* variable of the smoke step: `main` only
      # (the schedule, or a dispatch of main), with both the endpoint var and
      # the token secret set. Otherwise none of them reaches the fuzz process,
      # the credential included.
      OTLP_EXPORT: ${{ github.ref == 'refs/heads/main' && vars.OTLP_EXPORT_ENDPOINT != '' && secrets.DASH0_AUTHORIZATION_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: .github/scripts/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (pinned); channel via toolchain input
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Smoke-fuzz ${{ matrix.target }}
        env:
          # 300 s per target on the daily schedule; 60 s on a manual dispatch.
          BUDGET: ${{ github.event_name == 'schedule' && '300' || '60' }}
          # Fuzz input is an adversarial workload: export the metrics the code
          # under test already records to the external OTLP backend (#942,
          # fuzz/common/telemetry.rs), behind the job's OTLP_EXPORT gate. With
          # the gate shut every OTEL_* value below is empty, which leaves the
          # harness exactly as it is without telemetry. A failed export is
          # dropped and never fails the job. libFuzzer exits without running
          # destructors, so the last export interval of each run is lost; the
          # short interval bounds that. The exporter threads add background
          # coverage to the working corpus, which this job throws away.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ env.OTLP_EXPORT == 'true' && vars.OTLP_EXPORT_ENDPOINT || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ env.OTLP_EXPORT == 'true' && format('Authorization=Bearer {0}', secrets.DASH0_AUTHORIZATION_TOKEN) || '' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ env.OTLP_EXPORT == 'true' && 'http/protobuf' || '' }}
          OTEL_METRIC_EXPORT_INTERVAL: ${{ env.OTLP_EXPORT == 'true' && '10000' || '' }}
          # Upstream resource attributes only. The cicd.pipeline.run.id on
          # metrics is the opt-in the CI/CD semantic conventions ask for.
          OTEL_RESOURCE_ATTRIBUTES: >-
            ${{ env.OTLP_EXPORT == 'true' && format('deployment.environment.name=test,cicd.pipeline.name={0},cicd.pipeline.task.name=smoke-fuzz/{1},cicd.pipeline.run.id={2},vcs.ref.head.revision={3}', github.workflow, matrix.target, github.run_id, github.sha) || '' }}
          # Warn and error only on stderr, once a subscriber is installed.
          RUST_LOG: warn
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          # Force the gnu host triple. Left to default, cargo-fuzz picks
          # the musl target on the runner, whose statically-linked libc is
          # incompatible with the ASan sanitizer ("sanitizer is incompatible
          # with statically linked libc").
          host="$(rustc "+${NIGHTLY}" -vV | sed -n 's/^host: //p')"
          mkdir -p "fuzz/corpus/${target}"
          # Seed the working corpus from the committed seeds (RFC 0015 §3.3).
          # Copy the directory contents (`/.`) so an empty/odd glob can't
          # silently skip seeding; errors surface under `set -e` rather
          # than being swallowed.
          if [ -d "fuzz/seeds/${target}" ]; then
            cp -rn "fuzz/seeds/${target}/." "fuzz/corpus/${target}/"
          fi
          # `fuzz run` also builds, so a target that stops compiling fails
          # here too.
          cargo "+${NIGHTLY}" fuzz run "${target}" --target "${host}" -- -max_total_time="${BUDGET}"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # The ClusterFuzzLite corpus lives in GitHub Actions artifacts
  # (`cifuzz-corpus-<target>`, rolled by every run, 90-day expiry) — there is
  # no storage repo. A run that is cancelled mid-way loses what it fuzzed, so
  # these jobs never cancel; the shared group serialises the corpus writers.
  batch:
    name: cflite batch
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'batch'))
    runs-on: ubuntu-latest
    concurrency:
      group: fuzz-corpus-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build fuzzers (address)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
      - name: Run fuzzers (address)
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: batch
          sanitizer: address

  coverage:
    name: cflite coverage
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'coverage'))
    runs-on: ubuntu-latest
    concurrency:
      group: fuzz-coverage-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build fuzzers (coverage)
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage
      - name: Run fuzzers (coverage)
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
