name: licenses

# Third-party license attribution gate. Regenerates THIRD-PARTY-LICENSES.md
# with cargo-about and fails on drift — the same no-diff pattern as the semconv
# codegen gate in ci.yml. Dependency changes are what move the attribution, so
# it is path-filtered to the files that can change the shipped license set.
#
# cargo-about's `accepted` set (about.toml) MIRRORS the deny.toml allow-list;
# cargo-deny (the `deny` job in ci.yml) stays the enforcement gate. A new
# dependency under a non-accepted license fails `cargo about generate` outright,
# and `--fail` also errors on any crate whose license can't be resolved — a
# second license signal alongside cargo-deny.

on:
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - about.toml
      - about.hbs
      - THIRD-PARTY-LICENSES.md
      - .github/workflows/licenses.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - about.toml
      - about.hbs
      - THIRD-PARTY-LICENSES.md
      - .github/workflows/licenses.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  licenses:
    name: cargo about (no-diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      # Pin cargo-about so the attribution is reproducible and the no-diff gate
      # can't flake on a new release changing output; bump deliberately
      # alongside any about.toml / about.hbs change.
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-about@0.9.1
      - name: Regenerate THIRD-PARTY-LICENSES.md
        run: cargo about generate --fail about.hbs > THIRD-PARTY-LICENSES.md
      - name: Verify attribution is in sync
        run: |
          set -euo pipefail
          # `git status --porcelain` (not `git diff --exit-code`) so an
          # *untracked* regenerated file — the case where the committed
          # attribution was removed entirely — also fails, mirroring the
          # semconv codegen gate. `git diff` ignores untracked files.
          if [ -n "$(git status --porcelain THIRD-PARTY-LICENSES.md)" ]; then
            echo "::error::THIRD-PARTY-LICENSES.md is out of date or untracked. Run 'cargo about generate about.hbs > THIRD-PARTY-LICENSES.md' and commit."
            git status --porcelain THIRD-PARTY-LICENSES.md
            git diff -- THIRD-PARTY-LICENSES.md || true
            exit 1
          fi
