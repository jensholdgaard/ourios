name: Capture Software Bill of Behaviour (one-off)

# One-off, dispatch-only capture of a real runtime behaviour profile for
# ourios-server: an ephemeral kind cluster, Kubescape's node-agent
# (eBPF-based; needs a real Linux kernel, which is why this runs on the
# GitHub-hosted runner rather than a local VM), the real Ourios Helm chart,
# and a mix of OTLP ingest + query traffic during the node-agent's learning
# window. The output is the raw ApplicationProfile CR(s) as a downloadable
# artifact for manual review — this workflow does not commit anything back
# to the repo, and it never fires automatically (no push/PR/schedule
# trigger), matching the dispatch-only precedent in pages.yml. This is an
# exploration, not a supply-chain gate: nothing here is required for a
# release, and nothing about it belongs in CLAUDE.md hazards/invariants.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPO: ourios
  IMAGE_TAG: bob-capture
  KIND_CLUSTER: ourios-bob
  KS_NAMESPACE: honey
  TENANT: ourios-bob
  LOG_BODY: user 1 logged in

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build image
        run: docker build -t "${IMAGE_REPO}:${IMAGE_TAG}" .

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Load image into kind
        run: kind load docker-image "${IMAGE_REPO}:${IMAGE_TAG}" --name "${KIND_CLUSTER}"

      # OpenEBS local-hostpath: the StorageClass Kubescape's own storage
      # component needs. Mirrors Vad1mo/bobctl's `make storage` target
      # (openebs-operator-lite + a local-hostpath SC, set as cluster default).
      - name: Install OpenEBS (local-hostpath StorageClass)
        run: |
          kubectl apply -f https://openebs.github.io/charts/openebs-operator-lite.yaml
          kubectl apply -f https://openebs.github.io/charts/openebs-lite-sc.yaml
          kubectl apply -f - <<'YAML'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-hostpath
            annotations:
              openebs.io/cas-type: local
              cas.openebs.io/config: |
                - name: StorageType
                  value: hostpath
                - name: BasePath
                  value: /var/local-hostpath
          provisioner: openebs.io/local
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          YAML
          kubectl patch storageclass local-hostpath -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      # Kubescape operator + node-agent (eBPF). Learning window kept short
      # (this is a one-off capture, not a production tuning run) — long
      # enough to observe a handful of ingest/query/compaction cycles.
      - name: Install Kubescape operator
        run: |
          helm repo add kubescape https://kubescape.github.io/helm-charts/
          helm repo update
          helm upgrade --install kubescape kubescape/kubescape-operator \
            --version 1.29.0 -n "${KS_NAMESPACE}" --create-namespace \
            --values - <<'YAML'
          nodeAgent:
            config:
              maxLearningPeriod: 6m
              learningPeriod: 4m
              updatePeriod: 10000m
              ruleCooldown:
                ruleCooldownDuration: 0h
                ruleCooldownAfterCount: 1000000000
                ruleCooldownOnProfileFailure: false
                ruleCooldownMaxSize: 20000
          capabilities:
            runtimeDetection: enable
            networkEventsStreaming: disable
          alertCRD:
            installDefault: true
            scopeClustered: true
          clusterName: ourios-bob-capture
          ksNamespace: honey
          excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,kubeconfig,gmp-system,gmp-public,storm,lightening,cert-manager,kube-flannel,ingress-nginx"
          YAML
          sleep 5
          kubectl rollout restart -n "${KS_NAMESPACE}" ds node-agent
          kubectl wait --for=condition=ready pod -l app=kubevuln -n "${KS_NAMESPACE}" --timeout=180s
          kubectl wait --for=condition=ready pod -l app=node-agent -n "${KS_NAMESPACE}" --timeout=180s

      # The real chart, local storage backend (zero external deps — this
      # exercise is about runtime behaviour, not the S3 path deploy-test.yml
      # already covers). Single querier replica: one profile per role, not N.
      - name: helm install ourios
        run: |
          helm install ourios deploy/helm/ourios \
            --set image.repository="${IMAGE_REPO}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Never \
            --set storage.backend=local \
            --set querier.replicas=1 \
            --set compactor.intervalSecs=30 \
            --wait --timeout 5m

      - name: Wait for workloads
        run: |
          kubectl rollout status statefulset/ourios-receiver --timeout=180s
          kubectl rollout status deploy/ourios-querier --timeout=180s
          kubectl rollout status deploy/ourios-compactor --timeout=180s

      # Drive a realistic mix of ingest + query traffic across the learning
      # window so the recorded profile reflects steady-state behaviour, not
      # just startup. No receiver restarts here on purpose — a restart is
      # itself atypical behaviour we don't want baked into the profile.
      - name: Drive traffic for the learning window
        run: |
          kubectl port-forward svc/ourios-querier 4319:4319 >/tmp/pf-q.log 2>&1 &
          pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do if (echo > /dev/tcp/127.0.0.1/4319) >/dev/null 2>&1; then break; fi; sleep 1; done

          for i in $(seq 1 9); do
            kubectl delete job otlp-ingest --ignore-not-found >/dev/null
            kubectl apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: otlp-ingest
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: telemetrygen
                    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.155.0@sha256:32d1762abb401e36dd8cfdf60a71075b41bd996a0cfb7c8d2e6eac4d609625b9
                    args:
                      - logs
                      - --otlp-endpoint=ourios-receiver:4317
                      - --otlp-insecure
                      - --logs=20
                      - --otlp-header=x-ourios-tenant="${TENANT}"
                      - --otlp-attributes=service.name="${TENANT}"
                      - --body=${LOG_BODY}
          YAML
            kubectl wait --for=condition=complete job/otlp-ingest --timeout=60s || true

            curl -s -X POST 'http://127.0.0.1:4319/v1/query' \
              -H "X-Ourios-Tenant: ${TENANT}" \
              -H 'Content-Type: text/plain' \
              --data "service == \"${TENANT}\" | range(-1h, now) | limit 50" >/dev/null || true

            echo "traffic round $i/9 done"
            sleep 30
          done

      # maxLearningPeriod (6m) plus slack for Kubescape to flip the status
      # annotation. Poll rather than a fixed sleep — completion timing isn't
      # exact.
      - name: Wait for ApplicationProfiles to complete
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            total="$(kubectl get applicationprofile -o json | jq '.items | length')"
            done_count="$(kubectl get applicationprofile -o json | jq '[.items[] | select(.metadata.annotations["kubescape.io/status"] == "completed")] | length')"
            echo "applicationprofiles: ${done_count}/${total} completed"
            if [ "${total}" -gt 0 ] && [ "${done_count}" = "${total}" ]; then break; fi
            sleep 20
          done
          kubectl get applicationprofile -o wide || true

      - name: Export ApplicationProfiles
        run: |
          mkdir -p bob-out
          kubectl get applicationprofile -o yaml > bob-out/applicationprofiles.yaml
          kubectl get applicationprofile -o json \
            | jq -r '.items[] | .metadata.name' > bob-out/profile-names.txt
          cat bob-out/profile-names.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ourios-bob-capture
          path: bob-out/
          retention-days: 14

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get applicationprofile -A -o yaml || true
          echo "=== receiver logs ==="; kubectl logs -l app.kubernetes.io/component=receiver --tail=200 || true
          echo "=== querier logs ===";  kubectl logs -l app.kubernetes.io/component=querier --tail=200 || true
          echo "=== node-agent logs ==="; kubectl logs -n "${KS_NAMESPACE}" -l app=node-agent --tail=200 || true
