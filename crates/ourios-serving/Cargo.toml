[package]
name = "ourios-serving"
version.workspace = true
description = "Ourios shared serving infrastructure — bearer auth resolution (RFC 0026/0029/0047), TLS listener plumbing (RFC 0030), and inbound trace-context propagation (RFC 0039), shared by the receiver and querier roles (RFC 0051)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ourios_serving"
path = "src/lib.rs"

[dependencies]
ourios-core = { path = "../ourios-core" }
ourios-semconv = { path = "../ourios-semconv" }

# propagation extracts W3C trace context from HTTP headers (axum's
# HeaderMap) and gRPC metadata (tonic's MetadataMap) — RFC 0039 §3.2.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

# futures-core supplies the `Stream` bound on the gRPC TLS adapter.
futures-core = { version = "0.3", default-features = false }
# The handshake-failure counter and the propagation Context — API only;
# the SDK lives in the binary (RFC 0039 §3.5).
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
# RFC 0030 TLS seam: rustls builds each listener's ServerConfig,
# tokio-rustls wraps each accepted TcpStream in the handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `.next()` on the incoming stream inside the gRPC TLS adapter.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# Reload-loop and resolver diagnostics ride the workspace tracing setup.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# propagation's unit tests drive a concrete TraceContextPropagator —
# same pin as the rest of the workspace.
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
# The resolver tests stand up a fake OpenFGA endpoint and speak its
# JSON wire shape.
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
# Forwarded to ourios-core until RFC 0051's client-move slice (PR B)
# relocates the OIDC / OpenFGA HTTP clients into this crate.
oidc = ["ourios-core/oidc"]
openfga = ["ourios-core/openfga"]

[lints]
workspace = true
