# Source: ourios/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: t-ourios-config
  labels:
    app.kubernetes.io/name: ourios
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
data:
  receiver.yaml: |
    storage:
      backend: "local"
      local:
        bucket_root: "/var/lib/ourios/data"
    receiver:
      enabled: true
      grpc_addr: "0.0.0.0:4317"
      http_addr: "0.0.0.0:4318"
      wal_root: "/var/lib/ourios/wal"
    compaction:
      enabled: false
  querier.yaml: |
    storage:
      backend: "local"
      local:
        bucket_root: "/var/lib/ourios/data"
    querier:
      enabled: true
      http_addr: "0.0.0.0:4319"
      default_window_secs: 3600
    compaction:
      enabled: false
  compactor.yaml: |
    storage:
      backend: "local"
      local:
        bucket_root: "/var/lib/ourios/data"
    compaction:
      enabled: true
      interval_secs: 300
