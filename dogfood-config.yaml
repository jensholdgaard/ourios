# Local dogfood config for `just dogfood-server` (RFC 0020 file front-end).
#
# Loopback-only and unauthenticated (open mode) — the justfile recipe explains
# why that is safe for a local dev capture. This file exists (rather than the
# recipe's OURIOS_* env vars) because `--config` is the *sole* config source and
# `storage.promoted_attributes` (RFC 0022) has no env-var form.
#
# It promotes the Claude Code / agent GenAI attributes to columns so a source
# can aggregate its own telemetry natively (RFC 0022 + RFC 0037 §3.3), e.g.
#   count by attr.model       — calls per model      (from api_request events)
#   count by attr.tool_name   — tool-use distribution (from tool_decision events)
#   count by attr.decision    — accept/deny mix       (from tool_decision events)
# These are Claude Code's *actual* (flat) attribute keys, verified against its
# OTLP output — not the OTel GenAI semantic-convention dotted form
# (gen_ai.request.model, gen_ai.tool.name, …), which Claude Code does not emit;
# promoting those would make always-null columns. A semconv-conformant source,
# or a Collector+OTTL remap to the dotted names, would promote those instead.
# Promotion is a write-side projection, so it applies to telemetry captured
# *after* the server starts with this config.
#
# Paths resolve from ${env:OURIOS_DOGFOOD_ROOT}, exported by the recipe.
#
# The receiver listens on 24317/24318, not the standard 4317/4318: `just
# jaeger-up`'s Collector claims those as the single OTLP front door a source
# points at, and fans out from there (traces -> Jaeger, logs -> back here).
# A source that wants no trace viewer can still skip the Collector and point
# straight at these ports.
#
# **The loopback bind constrains the Collector fan-out to Docker runtimes
# that route `host.docker.internal` through a VM** — macOS (colima, Docker
# Desktop), where the verification for this setup was done. On **native
# Linux** `host-gateway` resolves to the docker bridge address, which cannot
# reach a service bound to `127.0.0.1`, so the fan-out silently drops logs
# (the Collector logs an export error; traces to Jaeger are unaffected).
# Deliberately not "fixed" by binding `0.0.0.0`: this receiver runs in RFC
# 0026 open mode (no auth), so a non-loopback bind would accept telemetry
# from any reachable peer. On Linux either accept that trade-off knowingly
# on a trusted network, or give the Collector `network_mode: host` and point
# the exporter at `127.0.0.1:24317`. The interop test
# (`crates/ourios-server/tests/it/collector_interop.rs`) binds `0.0.0.0` for
# this same container->host reason, but it is a sandboxed CI fixture behind
# TLS + OIDC, not a long-lived local capture.
storage:
  backend: local
  local:
    bucket_root: ${env:OURIOS_DOGFOOD_ROOT}/store
  promoted_attributes:
    log:
      - model
      - tool_name
      - decision
receiver:
  enabled: true
  grpc_addr: "127.0.0.1:24317"
  http_addr: "127.0.0.1:24318"
  wal_root: ${env:OURIOS_DOGFOOD_ROOT}/wal
querier:
  enabled: true
  http_addr: "127.0.0.1:4319"
  mcp:
    enabled: true
