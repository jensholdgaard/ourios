{{- if .Values.receiver.enabled }}
{{- /* Headless service: stable network identity for the receiver StatefulSet. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ourios.fullname" . }}-receiver-headless
  labels:
    {{- include "ourios.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
spec:
  clusterIP: None
  {{- if include "ourios.replicatedWal" . }}
  # A restarting voter reaches its peers before its own readiness probe
  # passes, so their names resolve whether or not they are ready.
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "ourios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    {{- if include "ourios.replicatedWal" . }}
    {{- /* The replicated WAL's peer port, on this Service only (RFC 0065 §6.10). */}}
    - name: replication
      port: 4320
      targetPort: replication
      protocol: TCP
    {{- end }}
---
{{- /* Client-facing receiver service: OTLP gRPC + HTTP. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ourios.fullname" . }}-receiver
  labels:
    {{- include "ourios.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
spec:
  type: {{ .Values.receiver.service.type }}
  selector:
    {{- include "ourios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
{{- if include "ourios.replicatedWal" . }}
---
{{- /* The tail pool's stable identities and peer port (RFC 0065 §6.10). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ourios.fullname" . }}-wal-tail-headless
  labels:
    {{- include "ourios.labels" . | nindent 4 }}
    app.kubernetes.io/component: wal-tail
spec:
  clusterIP: None
  # A tail replica answers its peers before it is ready for exports.
  publishNotReadyAddresses: true
  selector:
    {{- include "ourios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wal-tail
  ports:
    - name: replication
      port: 4320
      targetPort: replication
      protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.querier.enabled }}
---
{{- /* Querier service: the logs-DSL query API over HTTP. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ourios.fullname" . }}-querier
  labels:
    {{- include "ourios.labels" . | nindent 4 }}
    app.kubernetes.io/component: querier
spec:
  type: {{ .Values.querier.service.type }}
  selector:
    {{- include "ourios.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: querier
  ports:
    - name: query-http
      port: 4319
      targetPort: query-http
      protocol: TCP
{{- end }}
