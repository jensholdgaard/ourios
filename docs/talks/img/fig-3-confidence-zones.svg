<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360"
     font-family="'Caveat', 'Patrick Hand', 'Comic Sans MS', cursive"
     font-size="22">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
  </defs>
  <style>
    .axis  { stroke: #1e1e1e; stroke-width: 2.5; stroke-linecap: round;
             fill: none; }
    .tick  { stroke: #1e1e1e; stroke-width: 2; }
    .marker{ stroke: #1e1e1e; stroke-width: 2; stroke-dasharray: 4 4; }
    .box   { fill: #fefefe; stroke: #1e1e1e; stroke-width: 2.5;
             stroke-linejoin: round; }
    .below { fill: #dbeafe; }
    .lossy { fill: #fed7aa; }
    .clean { fill: #d1fae5; }
    .label { fill: #1e1e1e; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 18px; }
    .arrow { stroke: #1e1e1e; stroke-width: 2; fill: none;
             marker-end: url(#arrow3); }
  </style>

  <!-- Canvas: keep a light background so the figure reads on any book theme. -->
  <rect width="100%" height="100%" fill="#fafaf9"/>

  <!-- Title row.  Inline style overrides the class text-anchor:middle,
       otherwise the first letter gets clipped off-canvas. -->
  <text class="label" x="40" y="36" style="text-anchor: start;">similarity to best candidate</text>
  <path class="arrow" d="M 330 32 L 380 32"/>

  <!-- Axis from 0 to 1; x = 60 + 640 * similarity -->
  <line class="axis" x1="60" y1="80" x2="700" y2="80"/>
  <text class="label" x="60"  y="58">0</text>
  <text class="label" x="700" y="58">1</text>

  <!-- Default floor 0.4 and threshold 0.7 -->
  <line class="marker" x1="316" y1="80" x2="316" y2="160"/>
  <line class="marker" x1="508" y1="80" x2="508" y2="160"/>
  <text class="label small" x="316" y="178">floor 0.4</text>
  <text class="label small" x="508" y="178">threshold 0.7</text>

  <!-- Three zone rectangles -->
  <rect class="box below" x="60"  y="200" width="246" height="130" rx="6"/>
  <rect class="box lossy" x="322" y="200" width="176" height="130" rx="6"/>
  <rect class="box clean" x="518" y="200" width="182" height="130" rx="6"/>

  <text class="label" x="183" y="222" font-size="22">below floor</text>
  <text class="label small" x="183" y="258">different event:</text>
  <text class="label small" x="183" y="280">new clean template</text>

  <text class="label" x="410" y="222" font-size="22">lossy zone</text>
  <text class="label small" x="410" y="252">new template,</text>
  <text class="label small" x="410" y="274">body retained,</text>
  <text class="label small" x="410" y="296">lossy_flag false</text>

  <text class="label" x="609" y="222" font-size="22">clean attach</text>
  <text class="label small" x="609" y="258">template + params</text>
  <text class="label small" x="609" y="280">only</text>
</svg>
