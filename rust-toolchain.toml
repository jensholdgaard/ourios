[toolchain]
# Pinned per CLAUDE.md §6.1 ("Rust stable, pinned in rust-toolchain.toml.
# MSRV documented."). This file is the source of truth for the toolchain
# used by every contributor, by CI, and by the image builds. An exact
# version, not `stable`, so a new Rust release (and the lints it brings)
# lands as a Renovate PR rather than as overnight breakage on every PR.
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
