[package]
name = "ourios-serving"
version.workspace = true
description = "Ourios shared serving infrastructure — bearer auth resolution (RFC 0026/0029/0047), TLS listener plumbing (RFC 0030), and inbound trace-context propagation (RFC 0039), shared by the receiver and querier roles (RFC 0051)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ourios_serving"
path = "src/lib.rs"

[dependencies]
ourios-core = { path = "../ourios-core" }
ourios-semconv = { path = "../ourios-semconv" }

# propagation extracts W3C trace context from HTTP headers (axum's
# HeaderMap) and gRPC metadata (tonic's MetadataMap) — RFC 0039 §3.2.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }

# futures-core supplies the `Stream` bound on the gRPC TLS adapter.
futures-core = { version = "0.3", default-features = false }
# The handshake-failure counter and the propagation Context — API only;
# the SDK lives in the binary (RFC 0039 §3.5).
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
# RFC 0030 TLS seam: rustls builds each listener's ServerConfig,
# tokio-rustls wraps each accepted TcpStream in the handshake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `.next()` on the incoming stream inside the gRPC TLS adapter.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# Reload-loop and resolver diagnostics ride the workspace tracing setup.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# --- oidc / openfga client stack (feature-gated; RFC 0051) ---
# decode pins the cached key's algorithm, so `alg: none` and HMAC are
# rejected whatever a token's header claims.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
# JWKS discovery + rotation refetch (RFC 0029 §3.2) and the OpenFGA
# wire calls (RFC 0047). Same rustls stack as the rest of the tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", default-features = false, features = ["std", "derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The fixture JWKS/OpenFGA servers answer JSON — the `json` feature is
# test-only; the library itself never serializes axum responses.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
# The OIDC verifier tests mint fixture JWKS material at test runtime
# (no committed private-key fixtures for scanners to flag) — pins
# moved with the module from ourios-core (RFC 0051).
base64 = "=0.23.1"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "pem", "arithmetic"] }
rand = "=0.8.7"
rsa = { version = "=0.9.10", default-features = false, features = ["std", "pem"] }
# The AuthMetrics test collects the exported stream via the in-memory
# provider guard.
ourios-telemetry = { path = "../ourios-telemetry", features = ["testing"] }
# propagation's unit tests drive a concrete TraceContextPropagator —
# same pin as the rest of the workspace.
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace", "metrics"] }
# The resolver tests stand up a fake OpenFGA endpoint and speak its
# JSON wire shape.
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
# The RFC 0029 OIDC bearer layer (verifier + JWKS cache) — moved here
# from ourios-core by RFC 0051 together with the whole HTTP stack.
oidc = ["dep:jsonwebtoken", "dep:reqwest", "dep:serde", "dep:serde_json"]
# The RFC 0047 OpenFGA resolver (HTTP client + session cache). Same
# reqwest/rustls stack as `oidc`; the config types stay in ourios-core.
openfga = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[lints]
workspace = true
