# OSV-Scanner ignore list — the OSV/GHSA counterpart of `deny.toml`'s reasoned
# `advisories.ignore` (which covers only the RustSec DB).
#
# Consumed by OpenSSF Scorecard's Vulnerabilities check (`.github/workflows/
# scorecard.yml`), which runs OSV-Scanner; OSV-Scanner auto-discovers this file
# at the repo root and honours its ignores. It scans the full lockfile, so it
# flags advisories that have a GHSA/OSV id but no RustSec id (which `cargo deny`
# misses) or that aren't in the build graph at all.
#
# Each entry is reviewed and accepted with a reason, and carries an `ignoreUntil`
# so the finding re-surfaces for re-evaluation rather than being masked forever.

# reason: quinn-proto 0.11.14 (RUSTSEC-2026-0185, DoS) is present in Cargo.lock
# but NOT in the build graph under any target/feature
# (`cargo tree -i quinn-proto --target all --all-features` => nothing), so it is
# never compiled into any Ourios binary — a lockfile-only false positive.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0185"
ignoreUntil = 2026-12-31
reason = "quinn-proto not in the build graph (lockfile-only; cargo tree --target all --all-features finds nothing); ignoreUntil re-checks in case it later enters the graph"
