# Local dogfood config for `just dogfood-server` (RFC 0020 file front-end).
#
# Loopback-only and unauthenticated (open mode) — the justfile recipe explains
# why that is safe for a local dev capture. This file exists (rather than the
# recipe's OURIOS_* env vars) because `--config` is the *sole* config source and
# `storage.promoted_attributes` (RFC 0022) has no env-var form.
#
# It promotes the Claude Code / agent GenAI attributes to columns so a source
# can aggregate its own telemetry natively (RFC 0022 + RFC 0037 §3.3), e.g.
#   count by attr.model             — calls per model     (api_request events)
#   count by attr.tool_name         — tool-use distribution (tool_decision)
#   count by attr.decision          — accept/deny mix       (tool_decision)
#   sum(attr.cost_usd) by attr.model — spend per model     (api_request)
# These are Claude Code's *actual* (flat) attribute keys, verified against its
# OTLP output — not the OTel GenAI semantic-convention dotted form
# (gen_ai.request.model, gen_ai.tool.name, …), which Claude Code does not emit;
# promoting those would make always-null columns. A semconv-conformant source,
# or a Collector+OTTL remap to the dotted names, would promote those instead.
# Promotion is a write-side projection, so it applies to telemetry captured
# *after* the server starts with this config.
#
# Paths resolve from ${env:OURIOS_DOGFOOD_ROOT}, exported by the recipe.
#
# The receiver listens on 24317/24318, not the standard 4317/4318: `just
# jaeger-up`'s Collector claims those, so that a source pointing at the
# conventional OTLP port reaches the Collector.
#
# That does NOT mean every signal goes through it. `just dogfood-env` — the
# default — sends **logs straight to these ports** and routes only **traces**
# to the Collector (which forwards them to Jaeger), via the per-signal
# `OTEL_EXPORTER_OTLP_{LOGS,TRACES}_ENDPOINT` overrides. Nothing crosses the
# container->host boundary on that path, so it behaves identically on every
# Docker runtime. Sending everything to the Collector and letting it fan logs
# back here is the *single-endpoint variant*, for sources that cannot set
# per-signal vars — see the runtime caveat below.
#
# **The Collector's log fan-out depends on the Docker runtime.** It reaches
# this receiver via `host.docker.internal`, which routes through a VM on
# macOS (colima, Docker Desktop) — where this setup was verified — and so
# reaches the loopback bind. On **native Linux** `host-gateway` resolves to
# the docker bridge address, which cannot reach `127.0.0.1`, and the fan-out
# drops logs (the Collector logs an export error; traces to Jaeger are
# unaffected). The bind stays loopback regardless: this receiver runs in RFC
# 0026 open mode (no auth), so a non-loopback bind accepts telemetry from any
# peer that can reach it.
#
# The portable answer needs no container->host networking at all — send each
# signal to the process that owns it, via the per-signal endpoint overrides
# (`just dogfood-env` prints this variant):
#
#   OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://127.0.0.1:24318/v1/logs      # straight here
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces   # Collector -> Jaeger
# (the /v1/<signal> paths are required: per-signal endpoints are used AS-IS
# by spec-compliant exporters; a pathless value 404s silently — see the
# dogfood-env recipe's comment)
#
# The interop test (`crates/ourios-server/tests/it/collector_interop.rs`)
# does bind `0.0.0.0` for the same container->host reason, but it is a
# sandboxed CI fixture behind TLS + OIDC, not a long-lived open capture.
storage:
  backend: local
  local:
    bucket_root: ${env:OURIOS_DOGFOOD_ROOT}/store
  promoted_attributes:
    log:
      - model
      - tool_name
      - decision
      # The FinOps loop (sum/avg over spend and usage, RFC0002.17 +
      # RFC 0042): typed classes matching the AnyValue variants Claude
      # Code actually emits, verified against captured api_request
      # events — cost_usd is a doubleValue, the token counts intValues.
      # A bare (string-class) promotion of these keys would project
      # always-NULL columns (RFC 0022 §3.1 string-only rule), and
      # sum(attr.cost_usd) would yield a NULL aggregate — every input
      # excluded, value null — with no hint that the class was wrong:
      #   sum(attr.cost_usd) by attr.model
      #   sum(attr.output_tokens) by attr.model
      - { key: cost_usd, type: f64 }
      - { key: input_tokens, type: i64 }
      - { key: output_tokens, type: i64 }
receiver:
  enabled: true
  grpc_addr: "127.0.0.1:24317"
  http_addr: "127.0.0.1:24318"
  wal_root: ${env:OURIOS_DOGFOOD_ROOT}/wal
querier:
  enabled: true
  http_addr: "127.0.0.1:4319"
  mcp:
    enabled: true
