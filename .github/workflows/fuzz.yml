name: Fuzz

# Bounded smoke-fuzz of the RFC 0015 cargo-fuzz targets. Each target runs
# for a short budget; a crash fails the job and uploads the reproducer.
# This is the Phase 1 gate (RFC0015.5) — continuous fuzzing with corpus
# persistence is Phase 2 (ClusterFuzzLite).
#
# libFuzzer requires nightly; it is contained to this job via an explicit
# `+nightly-<date>` invocation, so the stable pin in `rust-toolchain.toml`
# still governs every shipping crate. Not a required check.

# Deliberately NOT on `pull_request`: the sanitizer build (datafusion
# under ASan, minutes per target) is too heavy for per-change CI.
# Bounded smoke-fuzz runs daily; continuous per-change fuzzing is Phase 2
# (ClusterFuzzLite, RFC0015.7). Use `workflow_dispatch` for an on-demand
# run against a branch.
#
# On `main` the run also exports the code under test's own OTel metrics to
# the external OTLP backend (#942); see the smoke step's env.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned for reproducibility; bumped by Renovate like the other
  # toolchains (RFC 0015 §7).
  NIGHTLY: nightly-2026-06-01

jobs:
  smoke-fuzz:
    name: smoke-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [miner_roundtrip, otlp_json, otlp_protobuf, wal_frame, dsl_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: .github/scripts/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (pinned); channel via toolchain input
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Smoke-fuzz ${{ matrix.target }}
        env:
          # 300 s per target on the daily schedule; 60 s on a manual dispatch.
          BUDGET: ${{ github.event_name == 'schedule' && '300' || '60' }}
          # Fuzz input is an adversarial workload: export the metrics the code
          # under test already records to the external OTLP backend (#942,
          # `ourios_fuzz::init_telemetry`). Only from `main` (the schedule, or
          # a dispatch of main), and only when both the endpoint var and the
          # token secret are set; an empty endpoint leaves the harness exactly
          # as it is without telemetry. A failed export is dropped and never
          # fails the job. libFuzzer exits without running destructors, so the
          # last export interval of each run is lost; the short interval bounds
          # that. The exporter threads add background coverage to the working
          # corpus, which this job throws away.
          # miner_roundtrip stays off until #945: with a real provider, every
          # per-input MinerCluster stays reachable from its gauge callbacks and
          # the target runs out of memory within seconds.
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ matrix.target != 'miner_roundtrip' && github.ref == 'refs/heads/main' && secrets.DASH0_AUTHORIZATION_TOKEN != '' && vars.OTLP_EXPORT_ENDPOINT || '' }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ github.ref == 'refs/heads/main' && secrets.DASH0_AUTHORIZATION_TOKEN != '' && format('Authorization=Bearer {0}', secrets.DASH0_AUTHORIZATION_TOKEN) || '' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_METRIC_EXPORT_INTERVAL: "10000"
          # Upstream resource attributes only. The cicd.pipeline.run.id on
          # metrics is the opt-in the CI/CD semantic conventions ask for.
          OTEL_RESOURCE_ATTRIBUTES: >-
            deployment.environment.name=test,cicd.pipeline.name=${{ github.workflow }},cicd.pipeline.task.name=smoke-fuzz/${{ matrix.target }},cicd.pipeline.run.id=${{ github.run_id }},vcs.ref.head.revision=${{ github.sha }}
          # Warn and error only on stderr, once a subscriber is installed.
          RUST_LOG: warn
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          # Force the gnu host triple. Left to default, cargo-fuzz picks
          # the musl target on the runner, whose statically-linked libc is
          # incompatible with the ASan sanitizer ("sanitizer is incompatible
          # with statically linked libc").
          host="$(rustc "+${NIGHTLY}" -vV | sed -n 's/^host: //p')"
          mkdir -p "fuzz/corpus/${target}"
          # Seed the working corpus from the committed seeds (RFC 0015 §3.3).
          # Copy the directory contents (`/.`) so an empty/odd glob can't
          # silently skip seeding; errors surface under `set -e` rather
          # than being swallowed.
          if [ -d "fuzz/seeds/${target}" ]; then
            cp -rn "fuzz/seeds/${target}/." "fuzz/corpus/${target}/"
          fi
          # `fuzz run` also builds, so a target that stops compiling fails
          # here too.
          cargo "+${NIGHTLY}" fuzz run "${target}" --target "${host}" -- -max_total_time="${BUDGET}"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
