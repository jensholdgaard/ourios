name: Ingest bench

# Manually-triggered wall-clock criterion micro-benches for the ingest
# write path (RFC 0014 — `ingest_write_path`: OTLP→WAL append+fsync,
# WAL→Parquet sink emit+flush) and WAL recovery (RFC0008.3 — `recovery`:
# replay non-amplification). The other `ourios-bench` criterion targets
# already have runners — b1/b2 in `query-bench.yml`, compaction in
# `compaction-bench.yml` — so this covers the remaining two.
#
# Numbers are **indicative diagnostics**: GitHub's shared runners have
# variable CPU, so they aren't comparable across runs and aren't the
# `docs/benchmarks.md` §1 baseline (`baseline-8vcpu-32gib`) — the
# authoritative baseline-hardware run is a separate, opt-in job. Not gating;
# runs only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest-bench:
    name: ingest + recovery benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No authenticated git ops here — don't leave the token in
          # `.git/config` (matches `compaction-bench.yml`).
          persist-credentials: false
      - name: Free runner disk space
        run: .github/scripts/free-disk-space.sh
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run ingest_write_path + recovery benches
        run: |
          set -euo pipefail
          # rust-cache restores target/, which can carry a prior run's
          # criterion results — clear so the artifact holds only this run.
          # (`pipefail` so a bench failure isn't masked by the `tee` pipe.)
          rm -rf target/criterion
          cargo bench -p ourios-bench --bench ingest_write_path --bench recovery -- \
            --warm-up-time 1 --measurement-time 3 2>&1 | tee ingest-bench.log
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## ourios-bench — ingest write-path + recovery (criterion)'
            echo
            echo '```'
            grep -E 'time:|thrpt:|^[A-Za-z0-9_]+/' ingest-bench.log 2>/dev/null \
              || tail -n 120 ingest-bench.log 2>/dev/null \
              || echo '(no output — the run failed before producing one)'
            echo '```'
            echo
            echo '> **Indicative only** — shared-runner CPU is variable; not comparable'
            echo '> across runs and not the `docs/benchmarks.md` §1 baseline.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ingest-bench
          path: |
            target/criterion
            ingest-bench.log
          if-no-files-found: warn
