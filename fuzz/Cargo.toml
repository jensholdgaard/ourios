# cargo-fuzz harness for Ourios (RFC 0015). Standalone workspace — built
# only under nightly with libFuzzer sanitizers, never by the stable
# workspace (`exclude = ["fuzz"]` in the root Cargo.toml). Not published;
# not subject to the workspace `unsafe_code = "deny"` lint, since the
# `fuzz_target!` macro expands to `unsafe` glue (RFC 0015 §3.1).
[package]
name = "ourios-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `prost::Message` for the decode → encode fixpoint oracle on the OTLP
# targets (`common/otlp.rs`); the same prost the ingester decodes with.
prost = { version = "0.14", default-features = false, features = ["std"] }
ourios-config = { path = "../crates/ourios-config" }
ourios-core = { path = "../crates/ourios-core" }
ourios-miner = { path = "../crates/ourios-miner" }
ourios-ingester = { path = "../crates/ourios-ingester", features = ["fuzzing"] }
ourios-parquet = { path = "../crates/ourios-parquet" }
ourios-wal = { path = "../crates/ourios-wal", features = ["fuzzing"] }
# `fuzzing` exposes the DSL → plan seam `dsl_parse` lowers through.
ourios-querier = { path = "../crates/ourios-querier", features = ["fuzzing"] }
# `audit_reader` re-encodes what it read through the writer's own
# `audit_events_to_batch`; these write that batch to Parquet bytes and hand
# them back to `AuditReader::open_bytes`. The versions ourios-parquet uses.
bytes = { version = "1", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow"] }
# `artifact_decode` compresses its input into a template-map frame, so the
# fuzzer can mutate the JSON body behind the zstd layer; the querier's zstd.
zstd = "0.13"
# Installs the OTel metrics provider when the standard OTLP env points at an
# OTLP/HTTP endpoint (`common/telemetry.rs`, which every target includes by
# path, so the package keeps no library API per RFC 0015 §3.1).
ourios-telemetry = { path = "../crates/ourios-telemetry", features = ["http-proto"] }

# Merge sequence: every line of the input into one tree, then bit-identical
# reconstruction per row (§3.3) and no silent merge across rows (§3.1).
[[bin]]
name = "miner_roundtrip"
path = "fuzz_targets/miner_roundtrip.rs"
test = false
doc = false
bench = false

# Untrusted-input boundary: OTLP/JSON decode must never panic, and what it
# accepts must survive the protobuf round trip the WAL stores.
[[bin]]
name = "otlp_json"
path = "fuzz_targets/otlp_json.rs"
test = false
doc = false
bench = false

# Untrusted-input boundary: OTLP/protobuf decode must never panic, and
# decode → encode must be a fixpoint.
[[bin]]
name = "otlp_protobuf"
path = "fuzz_targets/otlp_protobuf.rs"
test = false
doc = false
bench = false

# WAL frame decode: malformed bytes must yield a typed FrameError, never UB;
# a frame the writer produces reads back as (kind, payload).
[[bin]]
name = "wal_frame"
path = "fuzz_targets/wal_frame.rs"
test = false
doc = false
bench = false

# Untrusted-input boundary: the RFC 0002 DSL parsers (pipe text and the
# structured-JSON variant) serve /v1/query and MCP; they must never panic,
# and an accepted query must round-trip its canonical form (RFC0002.7). An
# accepted log query is then validated and lowered to its DataFusion plan
# (the querier's `fuzzing` feature): a rejection is the DSL's own error,
# never the engine's, and the plan is a function of the query (RFC0015.15).
[[bin]]
name = "dsl_parse"
path = "fuzz_targets/dsl_parse.rs"
test = false
doc = false
bench = false

# Persisted artifacts read back from object storage (miner snapshot,
# partition manifest, template-id high-water, template-map frame): corrupt
# bytes are a typed error or a discard, never a panic or a partial state;
# what decodes re-encodes to a fixpoint.
[[bin]]
name = "artifact_decode"
path = "fuzz_targets/artifact_decode.rs"
test = false
doc = false
bench = false

# Audit-event Parquet files read back from object storage: a typed
# AuditReaderError, never a panic; the events a file decodes to survive the
# writer's encoding and read back equal.
[[bin]]
name = "audit_reader"
path = "fuzz_targets/audit_reader.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace (belt-and-suspenders with the root
# `exclude`): this manifest is its own single-package workspace root.
[workspace]

# DataFusion 56 readiness: build against an upstream `main` revision that
# carries apache/datafusion#24770 (the #24769 row-group pruning fix).
# Mirrors the root Cargo.toml patch (this standalone workspace does not
# inherit it); delete both together once DataFusion 56 (or a 55.x carrying
# the backport) ships.
[patch.crates-io]
datafusion = { git = "https://github.com/apache/datafusion", rev = "f029b944c8d2f8e70f0c213f87160c12ddad6a09" }
