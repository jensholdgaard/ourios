name: Fuzz

# Bounded smoke-fuzz of the RFC 0015 cargo-fuzz targets. Each target runs
# for a short budget; a crash fails the job and uploads the reproducer.
# This is the Phase 1 gate (RFC0015.5) — continuous fuzzing with corpus
# persistence is Phase 2 (ClusterFuzzLite).
#
# libFuzzer requires nightly; it is contained to this job via an explicit
# `+nightly-<date>` invocation, so the stable pin in `rust-toolchain.toml`
# still governs every shipping crate. Not a required check.

# Deliberately NOT on `pull_request`: the sanitizer build (datafusion
# under ASan, minutes per target) is too heavy for per-change CI.
# Bounded smoke-fuzz runs daily; continuous per-change fuzzing is Phase 2
# (ClusterFuzzLite, RFC0015.7). Use `workflow_dispatch` for an on-demand
# run against a branch.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned for reproducibility; bumped by Renovate like the other
  # toolchains (RFC 0015 §7).
  NIGHTLY: nightly-2026-06-01

jobs:
  smoke-fuzz:
    name: smoke-fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [miner_roundtrip, otlp_json, otlp_protobuf, wal_frame, dsl_parse]
    env:
      # 300 s per target on the daily schedule; 60 s on a manual dispatch.
      BUDGET: ${{ github.event_name == 'schedule' && '300' || '60' }}
      FUZZ_LOG: ${{ github.workspace }}/fuzz-run.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: .github/scripts/free-disk-space.sh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (pinned); channel via toolchain input
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Force the gnu host triple. Left to default, cargo-fuzz picks
          # the musl target on the runner, whose statically-linked libc is
          # incompatible with the ASan sanitizer ("sanitizer is incompatible
          # with statically linked libc").
          host="$(rustc "+${NIGHTLY}" -vV | sed -n 's/^host: //p')"
          echo "FUZZ_HOST=${host}" >> "$GITHUB_ENV"
          # Built in its own step so the run below times fuzzing alone; a
          # target that stops compiling fails here.
          cargo "+${NIGHTLY}" fuzz build '${{ matrix.target }}' --target "${host}"
      - name: Smoke-fuzz ${{ matrix.target }}
        id: fuzz
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          mkdir -p "fuzz/corpus/${target}"
          # Seed the working corpus from the committed seeds (RFC 0015 §3.3).
          # Copy the directory contents (`/.`) so an empty/odd glob can't
          # silently skip seeding; errors surface under `set -e` rather
          # than being swallowed.
          if [ -d "fuzz/seeds/${target}" ]; then
            cp -rn "fuzz/seeds/${target}/." "fuzz/corpus/${target}/"
          fi
          # The log feeds the telemetry export below. `pipefail` keeps a
          # crash failing this step through the `tee`.
          echo "FUZZ_RUN_START=$(date +%s.%N)" >> "$GITHUB_ENV"
          rc=0
          cargo "+${NIGHTLY}" fuzz run "${target}" --target "${FUZZ_HOST}" -- \
            -max_total_time="${BUDGET}" -print_final_stats=1 2>&1 | tee "${FUZZ_LOG}" || rc=$?
          echo "FUZZ_RUN_END=$(date +%s.%N)" >> "$GITHUB_ENV"
          exit "${rc}"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      # Trend telemetry for the external OTLP backend (#942): coverage,
      # corpus, exec/s, memory and the outcome, per target. Only from
      # trusted runs on main (the schedule, or a dispatch of main), never
      # from a branch. It never affects the job: both steps continue on
      # error, and the export is a no-op while the endpoint variable or the
      # token secret is unset.
      - name: Summarise the run as metrics
        id: fuzz-metrics
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.fuzz.outcome }}
        run: |
          python3 .github/scripts/fuzz_stats.py --log "${FUZZ_LOG}" --target "${TARGET}" \
            --step-outcome "${OUTCOME}" --budget "${BUDGET}" \
            --start "${FUZZ_RUN_START:-}" --end "${FUZZ_RUN_END:-}" \
            > "${RUNNER_TEMP}/fuzz-metrics.json"
      - name: Export the metrics over OTLP
        if: always() && github.ref == 'refs/heads/main' && steps.fuzz-metrics.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/otlp-export
        with:
          endpoint: ${{ vars.OTLP_EXPORT_ENDPOINT }}
          token: ${{ secrets.DASH0_AUTHORIZATION_TOKEN }}
          metrics-file: ${{ runner.temp }}/fuzz-metrics.json
          service-name: ourios-fuzz
          resource-attributes: |
            cicd.pipeline.task.name=smoke-fuzz ${{ matrix.target }}
