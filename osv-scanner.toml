# OSV-Scanner ignore list — the OSV/GHSA counterpart of `deny.toml`'s reasoned
# `advisories.ignore` (which covers only the RustSec DB).
#
# Consumed by OpenSSF Scorecard's Vulnerabilities check (`.github/workflows/
# scorecard.yml`), which runs OSV-Scanner. OSV-Scanner looks for this file
# beside each lockfile it scans — so it has to exist next to `fuzz/Cargo.lock`
# too, which is why `fuzz/osv-scanner.toml` is a symlink to this one rather
# than a second copy of the reasons that would drift. It scans the full
# lockfile, so it flags advisories that have a GHSA/OSV id but no RustSec id
# (which `cargo deny` misses) or that aren't in the build graph at all.
#
# Each entry is reviewed and accepted with a reason, and carries an `ignoreUntil`
# so the finding re-surfaces for re-evaluation rather than being masked forever.

# reason: quinn-proto 0.11.14 (RUSTSEC-2026-0185, DoS) is present in Cargo.lock
# but NOT in the build graph under any target/feature
# (`cargo tree -i quinn-proto --target all --all-features` => nothing), so it is
# never compiled into any Ourios binary — a lockfile-only false positive.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0185"
ignoreUntil = 2026-12-31
reason = "quinn-proto not in the build graph (lockfile-only; cargo tree --target all --all-features finds nothing); ignoreUntil re-checks in case it later enters the graph"

# reason: quick-xml 0.39 (RUSTSEC-2026-0194 quadratic duplicate-attribute check;
# RUSTSEC-2026-0195 unbounded namespace-declaration allocation) is transitive via
# object_store, and no upgrade path exists yet: DataFusion 55 pins object_store
# ^0.13, and even object_store 0.14 pins quick-xml ^0.40, both below the patched
# >= 0.41. Exposure is low — quick-xml only parses XML responses from the
# operator-configured S3 endpoint — and the impact is DoS, not corruption or
# RCE. Mirrors the reasoned `deny.toml` ignore. Remove with the object_store
# release that takes quick-xml >= 0.41 (RFC 0021 phase 2b, epic #314).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
ignoreUntil = 2026-12-31
reason = "quick-xml <0.41 DoS via object_store; no upgrade path until an object_store release takes quick-xml >=0.41 (RFC 0021 phase 2b); S3-endpoint XML only; mirrors deny.toml"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
ignoreUntil = 2026-12-31
reason = "quick-xml <0.41 DoS via object_store; no upgrade path until an object_store release takes quick-xml >=0.41 (RFC 0021 phase 2b); S3-endpoint XML only; mirrors deny.toml"

# reason: `rsa` Marvin timing side-channel (RUSTSEC-2023-0071, no patch
# released) leaks private-key material through private-key-operation timing.
# Ourios never performs RSA private-key operations in production: the RFC 0029
# verifier only checks signatures against the issuer's public JWKS keys, and the
# only signing is of throwaway per-test-process fixture keys in dev-dependencies.
# Mirrors the reasoned `deny.toml` ignore. Re-evaluate if we ever sign
# (issuer-side) rather than verify, or when the constant-time rewrite ships.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-12-31
reason = "rsa Marvin side-channel needs RSA private-key ops; Ourios only verifies with public JWKS keys and never signs in production; mirrors deny.toml"
